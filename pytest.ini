[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    real_api: marks tests as requiring real API calls (may consume API quota)
    slow: marks tests as slow running (deselect with '-m "not slow"')

# 默认不运行真实API测试，除非明确指定
addopts = -v --tb=short

# 环境变量加载
env_files =
    .env
